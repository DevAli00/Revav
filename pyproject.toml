[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revav"
version = "0.1.0"
description = "Security product reverse engineering framework — extract, catalog, and map detection mechanisms to MITRE ATT&CK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ali", email = "alielboury2@gmail.com" },
]
keywords = ["security", "edr", "mitre-attack", "detection-engineering", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "click>=8.1",
    "rich>=13.0",
    "mitreattack-python>=3.0",
]

[project.scripts]
revav = "revav.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
